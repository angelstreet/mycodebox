name: Desktop app (mac)
# Builds the unsigned universal .dmg of desktop/ on a macOS runner. No signing identity, no secrets.
on:
  workflow_dispatch:
jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: mycodebox-desktop-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
