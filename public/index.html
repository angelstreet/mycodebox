<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0d0e12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="codebox" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="codebox" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
  <title>codebox</title>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Sessions">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7"  x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button class="icon-btn back-btn hidden" id="backBtn" aria-label="Back to grid">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="title" id="appTitle">codebox</div>
    <!-- fleet summary: counts per state, tap to filter -->
    <div class="summary" id="summary"></div>
    <div class="modes" id="modeBar">
      <button data-mode="card" class="mode-btn on" title="One session">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
      <button data-mode="list" class="mode-btn" title="Board">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="filterBtn" aria-label="Filter sessions" title="Filter by status / project / agent">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    </button>
    <button class="icon-btn" id="mgrBtn" aria-label="AI manager" title="AI manager: auto-answers, log">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3.5" r="1"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
    </button>
    <button class="icon-btn" id="notifyBtn" aria-label="Alerts" title="Alert me when a session needs you">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="icon-btn install-btn" id="installBtn" aria-label="Install app" title="Add to Home Screen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <!-- terminal font: A- / A+ on desktop, Aa popover (also phones) -->
    <div class="fontbox" id="fontBox">
      <button class="size-btn fdesk" id="fontDec" aria-label="Smaller text" title="Smaller text (Ctrl -)">A&minus;</button>
      <button class="size-btn fdesk" id="fontInc" aria-label="Larger text" title="Larger text (Ctrl =)">A+</button>
      <button class="size-btn" id="fontBtn" aria-label="Text size and fit" title="Text size / fit">Aa</button>
      <div class="fontpop hidden" id="fontPop">
        <div class="frow"><button id="fontDec2" aria-label="Smaller">&minus;</button><span id="fontSize">12</span><button id="fontInc2" aria-label="Larger">+</button><button id="fontReset" class="fr">reset</button></div>
        <button class="frow fit" id="fitToggle" aria-label="Fit sessions to cards"><i></i>Fit sessions to cards</button>
        <button class="frow fit" id="ctlToggle" aria-label="Show card move and jump buttons"><i></i>Move &amp; jump buttons</button>
      </div>
    </div>
    <!-- grid sizes: always visible, last on the right; tapping one shows the grid -->
    <div class="gridsizes" id="gridSizes" title="Grid">
      <button data-size="2"  class="size-btn" aria-label="Grid of 2">2</button>
      <button data-size="4"  class="size-btn" aria-label="Grid of 4">4</button>
      <button data-size="8"  class="size-btn" aria-label="Grid of 8">8</button>
      <button data-size="16" class="size-btn" aria-label="Grid of 16">16</button>
    </div>
  </header>

  <!-- codebox health: cpu / load / ram / disk (amber >= 85 %, red >= 95 %) -->
  <div class="health hidden" id="health" aria-label="codebox health"></div>

  <!-- filter bar: status / project / agent (funnel button; stays visible while a filter is active) -->
  <div class="filterbar hidden" id="filterBar"></div>

  <!-- attention banner: sessions waiting on you -->
  <div class="attention hidden" id="attention"></div>

  <nav id="tabs" class="tabs" aria-label="Sessions"></nav>

  <main id="main" class="main view-card">
    <section class="card-pane" id="cardPane"></section>
    <section class="grid-pane" id="gridPane"></section>
    <section class="list-pane" id="listPane"></section>
  </main>

  <footer class="dock" id="dock">
    <div class="dstat" id="dstat" role="status"></div>
    <div class="prompts" id="prompts">
      <button class="pbtn" id="histBtn" aria-label="Sent history" title="Sent history">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><polyline points="12 7 12 12 15 14"/></svg>
      </button>
      <button class="pbtn" id="multiBtn" aria-label="Send to several sessions" title="Multi-target">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <div class="pchips" id="pchips"></div>
    </div>
    <div class="mtargets hidden" id="mtargets"></div>
    <div class="keys" id="keys">
      <button data-key="Escape">esc</button>
      <button data-key="Enter">⏎</button>
      <button data-key="Up">↑</button>
      <button data-key="Down">↓</button>
      <button data-key="Tab">tab</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="y">y</button>
      <button data-key="n">n</button>
      <button data-key="C-c" class="danger">^C</button>
    </div>
    <div class="row">
      <button id="dockToggle" class="dtoggle" aria-label="Show / hide quick commands" title="Show / hide quick commands" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button id="tchip" class="tchip" aria-label="Change send target"><i id="tdot" class="adot"></i><span id="tname" class="tn">none</span></button>
      <textarea id="sendInput" rows="1" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="message…"></textarea>
      <button id="sendBtn" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>

  <div class="edge-swipe" id="edgeSwipe" aria-hidden="true"></div>

  <aside id="side" class="side" aria-hidden="true">
    <div class="side-head">
      <span class="ttl">Sessions</span>
      <span class="count" id="sessionCount">0</span>
      <button class="icon-btn" id="newSessBtn" aria-label="New session" title="New session">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
    <ul id="sessionList" class="session-list"></ul>
    <div class="side-sec">
      <div class="side-sub">Leases <span class="count" id="leaseCount"></span></div>
      <ul id="leaseList" class="lease-list"><li class="dim">loading…</li></ul>
    </div>
  </aside>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
