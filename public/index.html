<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0d0e12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mycodebox" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="mycodebox" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
  <title>mycodebox</title>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Sessions">
      <i data-icon="menu" data-size="20"></i>
    </button>
    <button class="icon-btn back-btn hidden" id="backBtn" aria-label="Back to grid">
      <i data-icon="chevron-left" data-size="20"></i>
    </button>
    <div class="title" id="appTitle">mycodebox</div>
    <button class="icon-btn res-toggle" id="resToggle" aria-label="Show or hide codebox resources" title="Hide the codebox resources (CPU, RAM, quota) and show the workspace filter">
      <i data-icon="chevron-left" data-size="16"></i>
    </button>
    <select class="wsel" id="wsSelect" aria-label="Workspace (repo)" title="Workspace: show one repo only"></select>
    <!-- fleet summary: counts per state, tap to filter -->
    <div class="summary" id="summary"></div>
    <div class="fgrp" id="filterGroup"><button class="icon-btn" id="filterBtn" aria-label="Filter sessions" title="Filter by status / project / agent">
      <i data-icon="filter" data-size="17"></i>
    </button>
      <div class="afs" id="activeFilters"></div>
    </div>
    <div class="viewctl">
    <div class="modes" id="modeBar">
      <button data-mode="list" class="mode-btn" title="Board">
        <i data-icon="list" data-size="15"></i>
      </button>
    </div>
    <!-- grid sizes: tapping one shows the grid -->
    <div class="gridsizes" id="gridSizes" title="Grid">
      <button data-size="1"  class="size-btn" aria-label="One session" title="One session">1</button>
      <button data-size="2"  class="size-btn" aria-label="Grid of 2">2</button>
      <button data-size="4"  class="size-btn" aria-label="Grid of 4">4</button>
      <button data-size="6"  class="size-btn" aria-label="Grid of 6">6</button>
    </div>
    </div>
    <button class="newbtn" id="topNewBtn" aria-label="New session" title="New session on codebox: name, model, priority, folder">
      <i data-icon="plus" data-size="15"></i><span>New</span>
    </button>
    <button class="icon-btn" id="alertsBtn" aria-label="Alerts feed" title="Alerts: what the manager and ghosty told you">
      <i data-icon="bell" data-size="18"></i><span class="acount hidden" id="alertsCount"></span>
    </button>
    <button class="icon-btn" id="moreBtn" aria-label="More" title="AI manager, usage, alerts, install, text size">
      <i data-icon="more" data-size="18"></i>
    </button>
    <div class="morepop hidden" id="morePop">
    <a class="icon-btn" href="/page-preview.html#manager" target="_blank" rel="noopener" aria-label="Preview new pages" title="Open page mockups in a new tab"><span class="ml">Preview new pages ↗</span></a>
    <button class="icon-btn" id="mgrBtn" aria-label="AI manager" title="AI manager: auto-answers, log">
      <i data-icon="bot" data-size="18"></i>
    <span class="ml">AI manager</span></button>
    <button class="icon-btn hidden" id="hiddenBtn" aria-label="Hidden sessions" title="Sessions you hid from the lists: bring them back">
      <i data-icon="eye-off" data-size="17"></i>
    <span class="ml">Hidden sessions</span></button>
    <button class="icon-btn" id="platBtn" aria-label="Platforms" title="Platforms: who holds what, deploy queue, deployed now">
      <i data-icon="server" data-size="17"></i>
    <span class="ml">Platforms</span></button>
    <button class="icon-btn" id="reviewBtn" aria-label="Review stops" title="Review stops: swipe good / bad">
      <i data-icon="review" data-size="17"></i>
    <span class="ml">Review stops (swipe)</span></button>
    <button class="icon-btn" id="decisionsBtn" aria-label="Jev decisions" title="Jev decisions: what Jev picked and what happened">
      <i data-icon="decisions" data-size="17"></i>
    <span class="ml">Jev decisions</span></button>
    <button class="icon-btn" id="usageBtn" aria-label="Usage" title="Usage: API-equivalent cost and tokens">
      <i data-icon="bar-chart" data-size="18"></i>
    <span class="ml">Usage &amp; cost</span></button>
    <button class="icon-btn" id="notifyBtn" aria-label="Alerts" title="Alert me when a session needs you">
      <i data-icon="bell" data-size="18"></i>
    <span class="ml">Alerts</span></button>
    <button class="icon-btn install-btn" id="installBtn" aria-label="Install app" title="Add to Home Screen">
      <i data-icon="download" data-size="18"></i>
    <span class="ml">Install app / get APK</span></button>
      <div class="mrow-font"><span class="ml">Text size</span>
    <!-- terminal font: A- / A+ on desktop, Aa popover (also phones) -->
    <div class="fontbox" id="fontBox">
      <button class="size-btn fdesk" id="fontDec" aria-label="Smaller text" title="Smaller text (Ctrl -)">A&minus;</button>
      <button class="size-btn fdesk" id="fontInc" aria-label="Larger text" title="Larger text (Ctrl =)">A+</button>
      <button class="size-btn" id="fontBtn" aria-label="Text size and fit" title="Text size / fit">Aa</button>
      <div class="fontpop hidden" id="fontPop">
        <div class="frow"><button id="fontDec2" aria-label="Smaller">&minus;</button><span id="fontSize">12</span><button id="fontInc2" aria-label="Larger">+</button><button id="fontReset" class="fr">reset</button></div>
        <button class="frow fit" id="fitToggle" aria-label="Fit sessions to cards"><i></i>Fit sessions to cards</button>
        <button class="frow fit" id="ctlToggle" aria-label="Show card move and jump buttons"><i></i>Move &amp; jump buttons</button>
      </div>
    </div>
      </div>
    </div>
  </header>

  <!-- codebox health: cpu / load / ram / disk (amber >= 85 %, red >= 95 %) -->
  <div class="health hidden" id="health" aria-label="codebox health"></div>
  <!-- subscription quota: codex / claude / minimax windows (amber >= 80 %, red >= 95 %); tap for details -->
  <button class="quota hidden" id="quota" aria-label="Subscription quota"></button>

  <!-- filter bar: status / project / agent (funnel button; stays visible while a filter is active) -->
  <div class="filterbar filterpop hidden" id="filterBar"></div>

  <!-- attention banner: sessions waiting on you -->
  <div class="alertrow" id="alertRow">
    <div class="attention" id="attention"></div>
    <div class="deployban" id="deployBanner" role="status" aria-live="polite"></div>
    <div class="leasebar" id="leaseBar"></div>
  </div>

  <nav id="tabs" class="tabs" aria-label="Sessions"></nav>

  <main id="main" class="main view-card">
    <section class="card-pane" id="cardPane"></section>
    <section class="grid-pane" id="gridPane"></section>
    <section class="list-pane" id="listPane"></section>
  </main>

  <footer class="dock" id="dock">
    <div class="dstat" id="dstat" role="status"></div>
    <div class="prompts" id="prompts">
      <button class="pbtn" id="histBtn" aria-label="Sent history" title="Sent history">
        <i data-icon="history" data-size="17"></i>
      </button>
      <button class="pbtn" id="multiBtn" aria-label="Send to several sessions" title="Multi-target">
        <i data-icon="multi" data-size="17"></i>
      </button>
      <div class="pchips" id="pchips"></div>
    </div>
    <div class="mtargets hidden" id="mtargets"></div>
    <div class="keys" id="keys">
      <button data-key="Escape">esc</button>
      <button data-key="Enter">⏎</button>
      <button data-key="Up">↑</button>
      <button data-key="Down">↓</button>
      <button data-key="Tab">tab</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="y">y</button>
      <button data-key="n">n</button>
      <button data-key="C-c" class="danger">^C</button>
    </div>
    <div class="row">
      <button id="dockToggle" class="dtoggle" aria-label="Show / hide quick commands" title="Show / hide quick commands" aria-expanded="true">
        <i data-icon="chevron-up" data-size="16"></i>
      </button>
      <button id="tchip" class="tchip" aria-label="Change send target"><i id="tdot" class="adot"></i><span id="tname" class="tn">none</span></button>
      <button id="attachBtn" class="mic" aria-label="Attach image" title="Attach an image (or paste / drop one): its path on the codebox is added to the message">
        <i data-icon="paperclip" data-size="20"></i>
      </button>
      <input type="file" id="attachFile" accept="image/*" multiple hidden />
      <textarea id="sendInput" rows="1" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="message…"></textarea>
      <button id="sendBtn" class="send" aria-label="Send">
        <i data-icon="send" data-size="20"></i>
      </button>
      <button id="micBtn" class="mic" aria-label="Voice message" title="Voice: tap to record, tap again to transcribe and send">
        <i data-icon="mic" data-size="20"></i>
      </button>
    </div>
  </footer>

  <div class="edge-swipe" id="edgeSwipe" aria-hidden="true"></div>

  <!-- Answer popup (phase 11): one bottom-right card for the owner; mounted once. -->
  <div id="askPopup" class="hidden" role="dialog" aria-label="Session awaiting your answer">
    <div class="ap-body"></div>
  </div>
  <button id="askPopupPill" class="hidden" type="button" aria-label="Sessions awaiting owner">
    <i data-icon="chevron-up" data-size="14"></i><span class="ap-pill-n">0</span> need you
  </button>

  <aside id="side" class="side" aria-hidden="true">
    <div class="side-head">
      <span class="ttl">Sessions</span>
      <span class="count" id="sessionCount">0</span>
      <button class="icon-btn dock-only" id="sideCollapseBtn" aria-label="Collapse list" title="Collapse the list">
        <i data-icon="menu" data-size="18"></i>
      </button>
      <button class="icon-btn" id="sideByProjectBtn" aria-label="Group by project" title="Group the list by project (repo)">
        <i data-icon="layers" data-size="17"></i>
      </button>
      <button class="icon-btn" id="sideGroupBtn" aria-label="New group" title="New group (drag sessions into it)">
        <i data-icon="folder-plus" data-size="17"></i>
      </button>
      <button class="icon-btn" id="newSessBtn" aria-label="New session" title="New session">
        <i data-icon="plus" data-size="18"></i>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <i data-icon="refresh" data-size="17"></i>
      </button>
    </div>
    <ul id="sessionList" class="session-list"></ul>
    <div id="parkBox" class="parkbox hidden"></div>
  </aside>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
